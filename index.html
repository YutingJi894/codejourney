<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CodeJourney</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7f4;color:#20352c;font:15px system-ui,sans-serif}main{max-width:960px;margin:auto;padding:24px}h1{font-size:32px;margin-bottom:4px}h2{font-size:19px}p{color:#65766c}section{background:white;border:1px solid #dce5dd;border-radius:16px;padding:20px;margin:16px 0}button,select,input,textarea{font:inherit;border:1px solid #cbd8ce;border-radius:8px;padding:10px;background:white;color:inherit}button{cursor:pointer}button.primary{background:#285b43;color:white;border:0}textarea{width:100%;min-height:90px}a{color:#285b43}nav{display:flex;gap:8px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stats div{background:#eaf1eb;padding:16px;border-radius:12px}.stats b{display:block;font-size:28px}.problem{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #edf0ed;flex-wrap:wrap}.heat{display:grid;grid-template-columns:repeat(13,1fr);gap:5px}.heat span{aspect-ratio:1;background:#e8eee8;border-radius:4px}.heat .yes{background:#43835d}details{margin:12px 0}summary{cursor:pointer;font-weight:600}small{color:#65766c}progress{width:100%;accent-color:#43835d}@media(max-width:500px){main{padding:12px}.stats div{padding:9px}.stats b{font-size:22px}}</style><main><h1>CodeJourney</h1><p>Make progress every day. You do not need to solve every problem.</p><nav><button onclick="show('home')">Dashboard</button><button onclick="show('road')">Learning Roadmap</button><button onclick="show('review')">Review</button><button onclick="show('notes')">Notes</button></nav><div id="view"></div><section><button onclick="backup()">Export Backup</button> <label>Import Backup <input type="file" accept="application/json" onchange="restore(this)"></label><p><small>Your data is stored in this browser. Export backups regularly.</small></p></section></main><script>
const weeks=[['Python & Array',[[1480,'Running Sum of 1d Array'],[1672,'Richest Customer Wealth'],[412,'Fizz Buzz'],[1108,'Defanging an IP Address'],[485,'Max Consecutive Ones']]],['Hash Map & Set',[[217,'Contains Duplicate'],[242,'Valid Anagram'],[1,'Two Sum'],[383,'Ransom Note'],[387,'First Unique Character in a String']]],['Two Pointers',[[344,'Reverse String'],[125,'Valid Palindrome'],[283,'Move Zeroes'],[26,'Remove Duplicates from Sorted Array'],[977,'Squares of a Sorted Array']]],['Sliding Window',[[643,'Maximum Average Subarray I'],[219,'Contains Duplicate II'],[1456,'Maximum Number of Vowels in a Substring of Given Length'],[3,'Longest Substring Without Repeating Characters']]],['Stack & Queue',[[20,'Valid Parentheses'],[232,'Implement Queue using Stacks'],[155,'Min Stack']]],['Binary Search',[[704,'Binary Search'],[35,'Search Insert Position'],[69,'Sqrt(x)']]],['Linked List',[[206,'Reverse Linked List'],[21,'Merge Two Sorted Lists'],[141,'Linked List Cycle']]],['Recursion & Tree',[[104,'Maximum Depth of Binary Tree'],[226,'Invert Binary Tree'],[94,'Binary Tree Inorder Traversal']]],['Heap',[[703,'Kth Largest Element in a Stream'],[1046,'Last Stone Weight'],[215,'Kth Largest Element in an Array']]],['Graph',[[733,'Flood Fill'],[200,'Number of Islands'],[133,'Clone Graph']]],['Backtracking',[[78,'Subsets'],[46,'Permutations'],[77,'Combinations']]],['Dynamic Programming',[[70,'Climbing Stairs'],[746,'Min Cost Climbing Stairs'],[198,'House Robber']]]];
const all=weeks.flatMap(w=>w[1]), labels=['Not Started','Learning','Understood','Can Reproduce','Mastered'];let s;try{s=JSON.parse(localStorage.getItem('codejourney-v1'))||{}}catch{s={}};s.p??={};s.days??={};s.notes??={};let page='home';const date=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const today=()=>date();function save(){localStorage.setItem('codejourney-v1',JSON.stringify(s))}function show(p){page=p;render()}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function change(id,v){s.p[id]={level:+v,review:today(),step:0};save();render()}function problem(p){let [id,n]=p;return `<div class="problem"><a target="_blank" rel="noopener" href="https://leetcode.com/problemset/?search=${encodeURIComponent(n)}">${id}. ${n}</a><select aria-label="Mastery Level" onchange="change(${id},this.value)">${labels.map((l,i)=>`<option value="${i}" ${s.p[id]?.level===i?'selected':''}>${l}</option>`).join('')}</select></div>`}function check(){let m=Number(document.querySelector('#minutes').value);if(!Number.isFinite(m)||m<1||m>1440){alert('Enter a valid study duration in minutes.');return}s.days[today()]=m;save();render()}function due(id){let p=s.p[id];if(!p||p.level<2||p.step>=4)return false;let d=new Date(p.review+'T00:00:00');d.setDate(d.getDate()+[1,3,7,14][p.step||0]);return date(d)<=today()}function reviewed(id){s.p[id].review=today();s.p[id].step=(s.p[id].step||0)+1;save();render()}function note(){let id=document.querySelector('#noteid').value;s.notes[id]=document.querySelector('#notetext').value;save();alert('Notes saved.')}function render(){let count=all.filter(p=>(s.p[p[0]]?.level||0)>=2).length, mastered=all.filter(p=>s.p[p[0]]?.level===4).length;let d=new Date(),streak=0;if(!s.days[date(d)])d.setDate(d.getDate()-1);while(s.days[date(d)]){streak++;d.setDate(d.getDate()-1)}let v=document.querySelector('#view');if(page==='home'){let next=all.find(p=>(s.p[p[0]]?.level||0)<2);v.innerHTML=`<section class="stats"><div><b>${streak}</b>Day Streak</div><div><b>${count}/${all.length}</b>Understood</div><div><b>${mastered}</b>Mastered</div></section><section><h2>Learning Progress</h2><progress value="${count}" max="${all.length}"></progress><h2>Recommended Next Problem</h2>${next?problem(next):'All problems studied!'}<h2>Daily Check-in</h2><p>Understanding hints and reviewing old problems count as learning, too.</p><input id="minutes" type="number" min="1" max="1440" value="${s.days[today()]||30}"> minutes <button class="primary" onclick="check()">${s.days[today()]?'Update Check-in':'Check In'}</button></section><section><h2>Last 91 Days</h2><div class="heat">${Array.from({length:91},(_,i)=>{let d=new Date();d.setDate(d.getDate()-90+i);let k=date(d);return `<span title="${k}: ${s.days[k]||0} minutes" class="${s.days[k]?'yes':''}"></span>`}).join('')}</div><p>Total study time: ${Object.values(s.days).reduce((a,b)=>a+Number(b),0)} minutes</p></section>`}else if(page==='road'){v.innerHTML='<section><h2>12-Week Learning Roadmap</h2>'+weeks.map((w,i)=>`<details ${i===0?'open':''}><summary>Week ${i+1} · ${w[0]}</summary>${w[1].map(problem).join('')}</details>`).join('')+'</section>'}else if(page==='review'){let ps=all.filter(p=>due(p[0]));v.innerHTML='<section><h2>Due for Review</h2><p>After understanding a problem, review it at intervals of 1, 3, 7, and 14 days.</p>'+(ps.length?ps.map(p=>problem(p)+`<button onclick="reviewed(${p[0]})">Mark Reviewed</button>`).join(''):'No problems due for review today.')+'</section>'}else{v.innerHTML=`<section><h2>Problem Notes</h2><select id="noteid" onchange="document.querySelector('#notetext').value=s.notes[this.value]||''">${all.map(p=>`<option value="${p[0]}">${p[0]}. ${p[1]}</option>`).join('')}</select><p>Approach, code, and where you got stuck</p><textarea id="notetext">${esc(s.notes[all[0][0]])}</textarea><button class="primary" onclick="note()">Save Notes</button></section>`}}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}));a.download='codejourney-backup.json';a.click();URL.revokeObjectURL(a.href)}async function restore(el){try{let x=JSON.parse(await el.files[0].text());if(!x.p||!x.days||!x.notes)throw Error();if(confirm('Replace your current learning records?')){s=x;save();render()}}catch{alert('Invalid backup file.')}}render();</script></html>
